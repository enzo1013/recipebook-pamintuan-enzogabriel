{% extends 'base.html' %}

{% load static %}

{% block title %}Recipe List | Recipe Book{% endblock %}

{% block page_heading %}Recipe List{% endblock %}

{% block content %}
    <ul>
        {% for recipe in object_list %}
        <li>
            <a href="{{ recipe.get_absolute_url }}">{{ recipe }}</a>
        </li>
        {% endfor %}
    </ul>
{% endblock %}
